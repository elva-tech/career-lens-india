<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/careerlens-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CareerLens India — Career Intelligence & Employability Platform helping students make informed career decisions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <title>CareerLens India — See the career before you choose it</title>
  </head>
  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (!redirect) return
        sessionStorage.removeItem('spa-redirect')
        if (redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
